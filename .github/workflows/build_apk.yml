name: Build Safarah APK (Cloud)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android Manifest with Full Internet Permissions
        run: |
          if [ ! -d "android" ]; then
            echo "Creating android directory..."
            flutter create . --platforms=android
          fi

          # تعريب اسم التطبيق
          sed -i 's/android:label="[^"]*"/android:label="سَفَرَة"/g' android/app/src/main/AndroidManifest.xml

          # حقن صلاحيات الإنترنت المطلوبة لنسخة Release
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"\/>' android/app/src/main/AndroidManifest.xml
          fi

          # السماح بالاتصال المباشر وتفادي حظر الشبكات
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
              tasks.matching { it.name.contains("checkAarMetadata") || it.name.contains("CheckAarMetadata") }.all {
                  enabled = false
              }
          }
          EOF

          echo "systemProp.org.gradle.internal.http.connectionTimeout=300000" >> ~/.gradle/gradle.properties
          echo "systemProp.org.gradle.internal.http.socketTimeout=300000" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m" >> ~/.gradle/gradle.properties

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: safarah-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk