name: safarah
description: "تطبيق سَفَرَة لإدارة ومتابعة حلقات تحفيظ القرآن الكريم بنظام Offline-First"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  supabase_flutter: ^2.5.0
  connectivity_plus: ^6.0.3
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^9.0.0
  intl: any
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#0A1118"
  adaptive_icon_foreground: "assets/images/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/